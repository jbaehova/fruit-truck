[package]
name = "fruit-truck"
version = "0.6.2"
description = "A lightweight OpenRouter image and video generation client"
authors = ["Johnny Bae"]
edition = "2021"
rust-version = "1.77.2"

[workspace]
members = [
  ".",
  "crates/fruit-truck-protocol",
  "crates/fruit-truck-core",
  "crates/fruit-truckd",
]
resolver = "2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22"
fruit-truck-core = { path = "crates/fruit-truck-core" }
fruit-truck-protocol = { path = "crates/fruit-truck-protocol" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2.10.1"
