[package]
name = "fruit-truckd"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fruit-truck-core = { path = "../fruit-truck-core" }
fruit-truck-protocol = { path = "../fruit-truck-protocol" }
serde_json = "1.0"
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
