[package]
name = "fruit-truck-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fruit-truck-protocol = { path = "../fruit-truck-protocol" }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
