name: Release macOS app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Unpublished v-prefixed tag to build or resume (for example, v0.6.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

jobs:
  preflight:
    name: Validate release contract and secrets
    runs-on: macos-15
    outputs:
      release_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: Capture immutable release source
        id: source
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload exact release dependency manifests for OSV
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-osv-source-${{ steps.source.outputs.sha }}
          path: |
            apps/desktop/package-lock.json
            apps/desktop/package.json
            apps/desktop/src-tauri/Cargo.lock
            apps/desktop/src-tauri/Cargo.toml
            apps/desktop/src-tauri/osv-scanner.toml
          if-no-files-found: error
          retention-days: 2

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Validate the release contract
        run: |
          node apps/desktop/scripts/check-release-contract.mjs \
            --repository-root "$GITHUB_WORKSPACE" \
            --tag "$RELEASE_TAG"

      - name: Verify the exact unpublished release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" ]]
          if release_json=$(gh release view "$RELEASE_TAG" --json isDraft 2>/dev/null); then
            [[ "$(jq -r '.isDraft' <<<"$release_json")" == "true" ]] || {
              printf 'Published releases are immutable. Create a new patch tag instead of repairing %s.\n' "$RELEASE_TAG" >&2
              exit 1
            }
          fi
          latest_tag=$(gh release view --json tagName --jq '.tagName' 2>/dev/null || true)
          if [[ -n "$latest_tag" ]]; then
            node apps/desktop/scripts/check-release-order.mjs \
              "$RELEASE_TAG" "$latest_tag"
          fi

      - name: Verify release credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=()
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            printf 'Missing required GitHub Actions secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Verify updater signing key
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          command -v minisign >/dev/null 2>&1 || brew install minisign
          fixture="$RUNNER_TEMP/fruit-truck-updater-key-check"
          printf 'Fruit Truck updater signing preflight\n' > "$fixture"
          npx tauri signer sign "$fixture"
          jq -r '.plugins.updater.pubkey' src-tauri/tauri.conf.json | \
            base64 --decode > "$RUNNER_TEMP/updater-public.key"
          base64 --decode < "$fixture.sig" > "$RUNNER_TEMP/updater-signature.minisig"
          minisign -Vm "$fixture" \
            -p "$RUNNER_TEMP/updater-public.key" \
            -x "$RUNNER_TEMP/updater-signature.minisig"

  release-osv:
    name: Scan exact release source with OSV
    needs: preflight
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@880d9b542cc66d36d91d51b3fbcc038f5f28cfc5
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      download-artifact: release-osv-source-${{ needs.preflight.outputs.release_sha }}
      scan-args: |-
        -r
        ./

  release-validation:
    name: Validate exact release source
    needs: preflight
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --locked --version 0.19.9

      - name: Install pinned cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version 0.9.0

      - name: Install desktop dependencies and Chromium
        run: |
          npm ci
          npx playwright install chromium

      - name: Run JavaScript checks, coverage, build, and headless E2E
        run: |
          npm run check
          npm run test:unit
          npm run test:coverage
          npm run build
          npm run test:e2e

      - name: Run Rust formatting, tests, and clippy
        run: |
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust coverage gate
        run: |
          cargo llvm-cov --locked \
            --manifest-path src-tauri/Cargo.toml \
            --all-features \
            --lcov \
            --output-path "$RUNNER_TEMP/fruit-truck-rust.lcov" \
            --fail-under-lines 35 \
            --fail-under-functions 20

      - name: Run advisory, license, source, and SBOM gates
        run: bash scripts/run-supply-chain-checks.sh "$RUNNER_TEMP/fruit-truck-supply-chain"

      - name: Build and launch the packaged native app
        run: |
          npm run build:e2e:desktop
          app_path=$(find src-tauri/target -path '*/bundle/macos/Fruit Truck E2E.app' -print -quit)
          test -n "$app_path"
          bash scripts/smoke-native-app.sh "$app_path"

  release-static:
    name: Validate exact release workflows
    needs: preflight
    runs-on: ubuntu-24.04
    env:
      SHELLCHECK_VERSION: 0.10.0
      SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
      ACTIONLINT_VERSION: 1.7.7
      ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}

      - name: Download pinned ShellCheck and actionlint
        run: |
          shellcheck_archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl --fail --location --retry 4 --retry-all-errors \
            --output "$shellcheck_archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$shellcheck_archive" | sha256sum --check
          tar -xJf "$shellcheck_archive" -C "$RUNNER_TEMP"

          actionlint_archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 4 --retry-all-errors \
            --output "$actionlint_archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$actionlint_archive" | sha256sum --check
          tar -xzf "$actionlint_archive" -C "$RUNNER_TEMP"

      - name: Run ShellCheck and actionlint
        run: |
          bash apps/desktop/scripts/check-ci-workflows.sh \
            "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" \
            "$RUNNER_TEMP/actionlint"

  release-macos:
    needs: [preflight, release-osv, release-validation, release-static]
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.96.0
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Install build dependencies
        run: |
          npm ci --prefix apps/desktop
          command -v minisign >/dev/null 2>&1 || brew install minisign

      - name: Prepare self-contained Apple Silicon assets
        run: |
          source apps/desktop/scripts/ffmpeg-version.env
          bash apps/desktop/scripts/prepare-macos-release-assets.sh \
            --source-archive "$RUNNER_TEMP/ffmpeg-$FFMPEG_VERSION.tar.xz"

      - name: Revalidate immutable release tag
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
        run: |
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          [[ "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")" == "$EXPECTED_RELEASE_SHA" ]] || {
            printf 'Release tag %s moved after preflight; refusing to publish.\n' "$RELEASE_TAG" >&2
            exit 1
          }

      - name: Find or create the draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$RELEASE_TAG" --json databaseId,isDraft > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --draft \
              --generate-notes \
              --title "Fruit Truck $RELEASE_TAG" \
              --notes $'Download `Fruit-Truck-macOS-universal.dmg` on an Apple Silicon Mac. Intel Macs are not supported.\n\nThe app includes FFprobe for local media inspection; users do not need Homebrew. The exact FFmpeg source archive, arm64 build configuration, and SHA-256 manifest are published with this release.\n\nSigned in-app updates are supported for users on 0.2.0 or newer. This build is signed with a Developer ID certificate and notarized by Apple.'
            for _ in {1..5}; do
              gh release view "$RELEASE_TAG" --json databaseId,isDraft > "$RUNNER_TEMP/release.json" 2>/dev/null && break
              sleep 2
            done
          fi
          release_id=$(jq -r '.databaseId' "$RUNNER_TEMP/release.json")
          release_draft=$(jq -r '.isDraft' "$RUNNER_TEMP/release.json")
          [[ "$release_id" =~ ^[0-9]+$ && "$release_draft" == "true" ]] || {
            printf 'Release %s is missing or is already published.\n' "$RELEASE_TAG" >&2
            exit 1
          }
          printf 'id=%s\n' "$release_id" >> "$GITHUB_OUTPUT"

      # Keep a stable public asset name for the GitHub Releases latest-download URL.
      - name: Build and upload Apple Silicon app, DMG, and updater
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ steps.release.outputs.id }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseBody: |
            Download `Fruit-Truck-macOS-universal.dmg` on an Apple Silicon Mac. Intel Macs are not supported.

            Fruit Truck includes FFprobe for local media inspection. No package manager or separate runtime is required.

            The matching FFmpeg source archive, arm64 build configuration, and SHA-256 manifest are published with this release.

            Signed in-app updates are supported for users on 0.2.0 or newer. This build is signed with a Developer ID certificate and notarized by Apple.
          releaseDraft: true
          prerelease: false
          retryAttempts: 2
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: --target aarch64-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.conf.json
          releaseAssetNamePattern: Fruit-Truck-macOS-universal[ext]

      - name: Notarize and staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_PATH=$(find apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name 'Fruit Truck_*_aarch64.dmg' -print -quit)
          test -n "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"

      - name: Verify the installed app is self-contained and trusted
        run: |
          APP_PATH=$(find apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name 'Fruit Truck.app' -print -quit)
          DMG_PATH=$(find apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name 'Fruit Truck_*_aarch64.dmg' -print -quit)
          test -n "$APP_PATH"
          test -n "$DMG_PATH"
          bash apps/desktop/scripts/verify-app-bundle-media-tools.sh "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --verify --strict --verbose=2 "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG_PATH"

      - name: Replace the release DMG with the notarized build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG_PATH=$(find apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name 'Fruit Truck_*_aarch64.dmg' -print -quit)
          cp "$DMG_PATH" Fruit-Truck-macOS-universal.dmg
          gh release upload "$RELEASE_TAG" \
            Fruit-Truck-macOS-universal.dmg \
            --clobber

      - name: Publish FFmpeg source, build configuration, and checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source apps/desktop/scripts/ffmpeg-version.env
          source_archive="$RUNNER_TEMP/ffmpeg-$FFMPEG_VERSION.tar.xz"
          test -f "$source_archive"
          cp "$source_archive" Fruit-Truck-ffmpeg-source.tar.xz
          cp apps/desktop/src-tauri/target/bundled-tools/licenses/ffmpeg/build-config-arm64.txt \
            Fruit-Truck-ffmpeg-build-config-arm64.txt
          printf '%s  %s\n' "$FFMPEG_SHA256" Fruit-Truck-ffmpeg-source.tar.xz > \
            Fruit-Truck-ffmpeg-source.sha256
          shasum -a 256 --check Fruit-Truck-ffmpeg-source.sha256
          gh release upload "$RELEASE_TAG" \
            Fruit-Truck-ffmpeg-source.tar.xz \
            Fruit-Truck-ffmpeg-build-config-arm64.txt \
            Fruit-Truck-ffmpeg-source.sha256 \
            --clobber

      - name: Verify release assets and updater
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash apps/desktop/scripts/verify-github-release.sh \
            "$RELEASE_TAG" \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_WORKSPACE"

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

      - name: Verify permanent download URL
        run: |
          download_url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/Fruit-Truck-macOS-universal.dmg"
          for _ in {1..12}; do
            curl --fail --silent --show-error --location --head "$download_url" >/dev/null && exit 0
            sleep 5
          done
          printf 'Download URL did not resolve: %s\n' "$download_url" >&2
          exit 1
