name: Release macOS app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Unpublished v-prefixed tag to build or resume (for example, v0.6.3)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

jobs:
  preflight:
    name: Validate release contract and secrets
    runs-on: macos-15
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Check out current release automation
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .release-automation

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Validate the release contract
        run: |
          node "$GITHUB_WORKSPACE/.release-automation/apps/desktop/scripts/check-release-contract.mjs" \
            --repository-root "$GITHUB_WORKSPACE" \
            --tag "$RELEASE_TAG"

      - name: Verify the exact unpublished release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" ]]
          if release_json=$(gh release view "$RELEASE_TAG" --json isDraft 2>/dev/null); then
            [[ "$(jq -r '.isDraft' <<<"$release_json")" == "true" ]] || {
              printf 'Published releases are immutable. Create a new patch tag instead of repairing %s.\n' "$RELEASE_TAG" >&2
              exit 1
            }
          fi
          latest_tag=$(gh release view --json tagName --jq '.tagName' 2>/dev/null || true)
          if [[ -n "$latest_tag" ]]; then
            node "$GITHUB_WORKSPACE/.release-automation/apps/desktop/scripts/check-release-order.mjs" \
              "$RELEASE_TAG" "$latest_tag"
          fi

      - name: Verify release credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=()
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            printf 'Missing required GitHub Actions secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Verify updater signing key
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          command -v minisign >/dev/null 2>&1 || brew install minisign
          fixture="$RUNNER_TEMP/fruit-truck-updater-key-check"
          printf 'Fruit Truck updater signing preflight\n' > "$fixture"
          npx tauri signer sign "$fixture"
          jq -r '.plugins.updater.pubkey' src-tauri/tauri.conf.json | \
            base64 --decode > "$RUNNER_TEMP/updater-public.key"
          base64 --decode < "$fixture.sig" > "$RUNNER_TEMP/updater-signature.minisig"
          minisign -Vm "$fixture" \
            -p "$RUNNER_TEMP/updater-public.key" \
            -x "$RUNNER_TEMP/updater-signature.minisig"

  release-macos:
    needs: preflight
    runs-on: macos-15
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Check out current release automation
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .release-automation

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            agent-kit/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Install build dependencies
        run: |
          npm ci --prefix apps/desktop
          npm ci --prefix agent-kit
          command -v minisign >/dev/null 2>&1 || brew install minisign

      - name: Prepare self-contained Apple Silicon assets
        run: |
          source apps/desktop/scripts/ffmpeg-version.env
          bash apps/desktop/scripts/prepare-macos-release-assets.sh \
            --source-archive "$RUNNER_TEMP/ffmpeg-$FFMPEG_VERSION.tar.xz"

      - name: Run release checks
        run: |
          npm run check --prefix apps/desktop
          npm run check --prefix agent-kit

      - name: Find or create the draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$RELEASE_TAG" --json databaseId,isDraft > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --draft \
              --generate-notes \
              --title "Fruit Truck $RELEASE_TAG" \
              --notes $'Download `Fruit-Truck-macOS-universal.dmg` on an Apple Silicon Mac. Intel Macs are not supported.\n\nThe app includes Fruit Truck Core, FFmpeg, Node.js, Agent Kit, and its skills; users do not need Homebrew or separate packages.\n\nSigned in-app updates are supported for users on 0.2.0 or newer. This build is signed with a Developer ID certificate and notarized by Apple.'
            for _ in {1..5}; do
              gh release view "$RELEASE_TAG" --json databaseId,isDraft > "$RUNNER_TEMP/release.json" 2>/dev/null && break
              sleep 2
            done
          fi
          release_id=$(jq -r '.databaseId' "$RUNNER_TEMP/release.json")
          release_draft=$(jq -r '.isDraft' "$RUNNER_TEMP/release.json")
          [[ "$release_id" =~ ^[0-9]+$ && "$release_draft" == "true" ]] || {
            printf 'Release %s is missing or is already published.\n' "$RELEASE_TAG" >&2
            exit 1
          }
          printf 'id=%s\n' "$release_id" >> "$GITHUB_OUTPUT"

      # Keep the legacy public asset name so the permanent landing-page URL keeps working.
      - name: Build and upload Apple Silicon app, DMG, and updater
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ steps.release.outputs.id }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseBody: |
            Download `Fruit-Truck-macOS-universal.dmg` on an Apple Silicon Mac. Intel Macs are not supported.

            Fruit Truck includes Core, FFmpeg, Node.js, Agent Kit, and its skills. No package manager or separate runtime is required.

            Signed in-app updates are supported for users on 0.2.0 or newer. This build is signed with a Developer ID certificate and notarized by Apple.
          releaseDraft: true
          prerelease: false
          retryAttempts: 2
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: --target aarch64-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.conf.json
          releaseAssetNamePattern: Fruit-Truck-macOS-universal[ext]

      - name: Notarize and staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_PATH=$(find apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name 'Fruit Truck_*_aarch64.dmg' -print -quit)
          test -n "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"

      - name: Verify the installed app is self-contained and trusted
        run: |
          APP_PATH=$(find apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name 'Fruit Truck.app' -print -quit)
          DMG_PATH=$(find apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name 'Fruit Truck_*_aarch64.dmg' -print -quit)
          test -n "$APP_PATH"
          test -n "$DMG_PATH"
          bash apps/desktop/scripts/verify-app-bundle-media-tools.sh "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --verify --strict --verbose=2 "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG_PATH"

      - name: Upload notarized DMG and FFmpeg compliance files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source apps/desktop/scripts/ffmpeg-version.env
          DMG_PATH=$(find apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name 'Fruit Truck_*_aarch64.dmg' -print -quit)
          cp "$DMG_PATH" Fruit-Truck-macOS-universal.dmg
          shasum -a 256 Fruit-Truck-macOS-universal.dmg > Fruit-Truck-macOS-universal.dmg.sha256
          cp "$RUNNER_TEMP/ffmpeg-$FFMPEG_VERSION.tar.xz" .
          cp apps/desktop/src-tauri/target/bundled-tools/licenses/ffmpeg/build-config-arm64.txt .
          shasum -a 256 \
            "ffmpeg-$FFMPEG_VERSION.tar.xz" \
            build-config-arm64.txt \
            > "ffmpeg-$FFMPEG_VERSION-assets.sha256"
          gh release upload "$RELEASE_TAG" \
            Fruit-Truck-macOS-universal.dmg \
            Fruit-Truck-macOS-universal.dmg.sha256 \
            "ffmpeg-$FFMPEG_VERSION.tar.xz" \
            build-config-arm64.txt \
            "ffmpeg-$FFMPEG_VERSION-assets.sha256" \
            THIRD_PARTY_NOTICES.md \
            --clobber

      - name: Verify release assets and updater
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash "$GITHUB_WORKSPACE/.release-automation/apps/desktop/scripts/verify-github-release.sh" \
            "$RELEASE_TAG" \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_WORKSPACE"

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

      - name: Verify permanent download URL
        run: |
          download_url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/Fruit-Truck-macOS-universal.dmg"
          for _ in {1..12}; do
            curl --fail --silent --show-error --location --head "$download_url" >/dev/null && exit 0
            sleep 5
          done
          printf 'Download URL did not resolve: %s\n' "$download_url" >&2
          exit 1
