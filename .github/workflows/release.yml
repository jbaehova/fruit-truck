name: Release macOS app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Unpublished v-prefixed tag to build or resume (for example, v0.6.2)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

jobs:
  preflight:
    name: Validate release contract and secrets
    runs-on: macos-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Check out current release automation
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .release-automation

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Validate tag, versions, updater, FFmpeg, and landing page contract
        run: |
          node "$GITHUB_WORKSPACE/.release-automation/apps/desktop/scripts/check-release-contract.mjs" \
            --repository-root "$GITHUB_WORKSPACE" \
            --tag "$RELEASE_TAG"

      - name: Verify checkout is the exact Git tag
        run: |
          checked_out_commit=$(git rev-parse HEAD)
          tag_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          [[ "$checked_out_commit" == "$tag_commit" ]]

      - name: Reject published or non-forward release targets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_json=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" | \
            jq -c --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)][0] // empty')
          if [[ -n "$release_json" && "$(jq -r '.draft' <<<"$release_json")" != "true" ]]; then
            printf 'Published releases are immutable. Create a new patch tag instead of repairing %s.\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null || true)
          if [[ -n "$latest_tag" ]]; then
            node "$GITHUB_WORKSPACE/.release-automation/apps/desktop/scripts/check-release-order.mjs" \
              "$RELEASE_TAG" "$latest_tag"
          fi

      - name: Verify release credentials are registered
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=()
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            printf 'Missing required GitHub Actions secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Install updater signing verifier
        working-directory: apps/desktop
        run: |
          npm ci
          command -v minisign >/dev/null 2>&1 || brew install minisign

      - name: Verify updater private key matches the embedded public key
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          fixture="$RUNNER_TEMP/fruit-truck-updater-key-check"
          printf 'Fruit Truck updater signing preflight\n' > "$fixture"
          npx tauri signer sign "$fixture"
          jq -r '.plugins.updater.pubkey' src-tauri/tauri.conf.json | \
            base64 --decode > "$RUNNER_TEMP/updater-public.key"
          base64 --decode < "$fixture.sig" > "$RUNNER_TEMP/updater-signature.minisig"
          minisign -Vm "$fixture" \
            -p "$RUNNER_TEMP/updater-public.key" \
            -x "$RUNNER_TEMP/updater-signature.minisig"

  build-ffmpeg:
    name: Build FFmpeg (${{ matrix.arch }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Install Intel assembler
        if: matrix.arch == 'x86_64'
        run: command -v nasm >/dev/null 2>&1 || brew install nasm

      - name: Build pinned LGPL FFmpeg
        env:
          FFMPEG_ARCH: ${{ matrix.arch }}
        run: |
          source apps/desktop/scripts/ffmpeg-version.env
          output_dir="$RUNNER_TEMP/ffmpeg-$FFMPEG_ARCH"
          mkdir -p "$output_dir"
          source_archive_args=()
          if [[ "$FFMPEG_ARCH" == "arm64" ]]; then
            source_archive_args=(--source-archive "$output_dir/ffmpeg-$FFMPEG_VERSION.tar.xz")
          fi
          bash apps/desktop/scripts/build-ffmpeg-macos.sh \
            --arch "$FFMPEG_ARCH" \
            --output-dir "$output_dir" \
            "${source_archive_args[@]}"

      - name: Upload architecture artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.arch }}
          path: ${{ runner.temp }}/ffmpeg-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14

  release-macos:
    needs: [preflight, build-ffmpeg]
    runs-on: macos-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Check out current release automation
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .release-automation

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Download FFmpeg architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-*
          path: ${{ runner.temp }}/ffmpeg-artifacts

      - name: Assemble and verify Universal FFmpeg
        run: |
          bash apps/desktop/scripts/assemble-universal-ffmpeg.sh \
            "$RUNNER_TEMP/ffmpeg-artifacts/ffmpeg-arm64" \
            "$RUNNER_TEMP/ffmpeg-artifacts/ffmpeg-x86_64"

      - name: Build Universal Fruit Truck Core helper
        run: bash apps/desktop/scripts/build-core-sidecar-universal.sh

      - name: Run desktop checks
        working-directory: apps/desktop
        run: |
          npm run test:unit
          npm run check
          cargo test --manifest-path src-tauri/Cargo.toml --workspace
          cargo test --manifest-path src-tauri/Cargo.toml -p fruit-truck-core --release \
            tests::one_hundred_session_command_p95_stays_below_twenty_milliseconds -- --ignored --exact

      - name: Find or create the GitHub release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_json=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" | \
            jq -c --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)][0] // empty')
          if [[ -z "$release_json" ]]; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --draft \
              --generate-notes \
              --title "Fruit Truck $RELEASE_TAG" \
              --notes $'Download `Fruit-Truck-macOS-universal.dmg` for Apple Silicon or Intel Macs.\n\nSigned in-app updates are supported for users on 0.2.0 or newer. Users upgrading from 0.1.x must install this DMG once; later releases can be installed from inside the app.\n\nThis build is signed with a Developer ID certificate and notarized by Apple.'
            release_json=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" | \
              jq -c --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)][0] // empty')
          fi
          release_id=$(jq -r '.id' <<<"$release_json")
          release_draft=$(jq -r '.draft' <<<"$release_json")
          [[ "$release_id" =~ ^[0-9]+$ ]]
          [[ "$release_draft" == "true" ]] || {
            printf 'Refusing to modify published release %s. Create a new patch tag.\n' "$RELEASE_TAG" >&2
            exit 1
          }
          printf 'id=%s\n' "$release_id" >> "$GITHUB_OUTPUT"

      - name: Build and upload Universal app, DMG, and signed updater
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ steps.release.outputs.id }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseBody: |
            Download `Fruit-Truck-macOS-universal.dmg` for Apple Silicon or Intel Macs.

            Signed in-app updates are supported for users on 0.2.0 or newer. Users upgrading from 0.1.x must install this DMG once; later releases can be installed from inside the app.

            This build is signed with a Developer ID certificate and notarized by Apple.
          releaseDraft: true
          prerelease: false
          retryAttempts: 2
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: --target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.conf.json
          releaseAssetNamePattern: Fruit-Truck-macOS-universal[ext]

      - name: Notarize and staple Universal DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_PATH=$(find apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          test -n "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"

      - name: Verify app bundle is self-contained and accepted by Gatekeeper
        run: |
          APP_PATH=$(find apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos -name 'Fruit Truck.app' -print -quit)
          DMG_PATH=$(find apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          test -n "$APP_PATH"
          test -n "$DMG_PATH"
          bash apps/desktop/scripts/verify-app-bundle-media-tools.sh "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --verify --strict --verbose=2 "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG_PATH"

      - name: Upload notarized DMG, FFmpeg compliance assets, and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source apps/desktop/scripts/ffmpeg-version.env
          DMG_PATH=$(find apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          test -n "$DMG_PATH"
          cp "$DMG_PATH" Fruit-Truck-macOS-universal.dmg
          DMG_HASH=$(shasum -a 256 Fruit-Truck-macOS-universal.dmg | cut -d ' ' -f 1)
          printf '%s  %s\n' "$DMG_HASH" "Fruit-Truck-macOS-universal.dmg" > Fruit-Truck-macOS-universal.dmg.sha256
          cp "$RUNNER_TEMP/ffmpeg-artifacts/ffmpeg-arm64/ffmpeg-$FFMPEG_VERSION.tar.xz" .
          cp apps/desktop/src-tauri/target/bundled-tools/licenses/ffmpeg/build-config-arm64.txt .
          cp apps/desktop/src-tauri/target/bundled-tools/licenses/ffmpeg/build-config-x86_64.txt .
          shasum -a 256 \
            "ffmpeg-$FFMPEG_VERSION.tar.xz" \
            build-config-arm64.txt \
            build-config-x86_64.txt \
            > "ffmpeg-$FFMPEG_VERSION-assets.sha256"
          gh release upload "$RELEASE_TAG" \
            Fruit-Truck-macOS-universal.dmg \
            Fruit-Truck-macOS-universal.dmg.sha256 \
            "ffmpeg-$FFMPEG_VERSION.tar.xz" \
            build-config-arm64.txt \
            build-config-x86_64.txt \
            "ffmpeg-$FFMPEG_VERSION-assets.sha256" \
            THIRD_PARTY_NOTICES.md \
            --clobber

      - name: Verify every required release asset and updater mapping
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash "$GITHUB_WORKSPACE/.release-automation/apps/desktop/scripts/verify-github-release.sh" \
            "$RELEASE_TAG" \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_WORKSPACE"

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

      - name: Verify landing-page download target
        run: |
          download_url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/Fruit-Truck-macOS-universal.dmg"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --head "$download_url" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          printf 'Landing-page download target did not resolve: %s\n' "$download_url" >&2
          exit 1
