name: Release macOS app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-ffmpeg:
    name: Build FFmpeg (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Intel assembler
        if: matrix.arch == 'x86_64'
        run: command -v nasm >/dev/null 2>&1 || brew install nasm

      - name: Build pinned LGPL FFmpeg
        env:
          FFMPEG_ARCH: ${{ matrix.arch }}
        run: |
          output_dir="$RUNNER_TEMP/ffmpeg-$FFMPEG_ARCH"
          mkdir -p "$output_dir"
          source_archive_args=()
          if [[ "$FFMPEG_ARCH" == "arm64" ]]; then
            source_archive_args=(--source-archive "$output_dir/ffmpeg-8.1.2.tar.xz")
          fi
          bash apps/desktop/scripts/build-ffmpeg-macos.sh \
            --arch "$FFMPEG_ARCH" \
            --output-dir "$output_dir" \
            "${source_archive_args[@]}"

      - name: Upload architecture artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.arch }}
          path: ${{ runner.temp }}/ffmpeg-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

  release-macos:
    needs: build-ffmpeg
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Download FFmpeg architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-*
          path: ${{ runner.temp }}/ffmpeg-artifacts

      - name: Assemble and verify Universal FFmpeg
        run: |
          bash apps/desktop/scripts/assemble-universal-ffmpeg.sh \
            "$RUNNER_TEMP/ffmpeg-artifacts/ffmpeg-arm64" \
            "$RUNNER_TEMP/ffmpeg-artifacts/ffmpeg-x86_64"

      - name: Verify release tag matches app version
        if: github.event_name == 'push'
        working-directory: apps/desktop
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          APP_VERSION=$(node -e "process.stdout.write(require('./src-tauri/tauri.conf.json').version)")
          test "$RELEASE_TAG" = "v$APP_VERSION"

      - name: Run desktop checks
        working-directory: apps/desktop
        run: |
          npm run test:unit
          npm run check
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Universal DMG and create draft release
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Fruit Truck ${{ github.ref_name }}
          releaseBody: |
            Download `Fruit-Truck-macOS-universal.dmg` for Apple Silicon or Intel Macs.

            Signed in-app updates are supported for users on 0.2.0 or newer. Users upgrading from 0.1.x must install this DMG once; later releases can be installed from inside the app.

            This build is ad-hoc signed and is not notarized by Apple. After copying the app to Applications, try to open it once, then go to System Settings → Privacy & Security → Open Anyway.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          args: --target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.conf.json
          releaseAssetNamePattern: Fruit-Truck-macOS-universal[ext]

      - name: Verify app bundle is self-contained
        run: |
          APP_PATH=$(find apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos -name 'Fruit Truck.app' -print -quit)
          test -n "$APP_PATH"
          bash apps/desktop/scripts/verify-app-bundle-media-tools.sh "$APP_PATH"

      - name: Upload DMG, FFmpeg compliance assets, and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          DMG_PATH=$(find apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          test -n "$DMG_PATH"
          bash apps/desktop/scripts/clean-dmg-volume-icon.sh "$DMG_PATH" Fruit-Truck-macOS-universal.dmg
          gh release upload "$RELEASE_TAG" Fruit-Truck-macOS-universal.dmg --clobber
          DMG_HASH=$(shasum -a 256 Fruit-Truck-macOS-universal.dmg | cut -d ' ' -f 1)
          printf '%s  %s\n' "$DMG_HASH" "Fruit-Truck-macOS-universal.dmg" > Fruit-Truck-macOS-universal.dmg.sha256
          cp "$RUNNER_TEMP/ffmpeg-artifacts/ffmpeg-arm64/ffmpeg-8.1.2.tar.xz" .
          cp apps/desktop/src-tauri/target/bundled-tools/licenses/ffmpeg/build-config-arm64.txt .
          cp apps/desktop/src-tauri/target/bundled-tools/licenses/ffmpeg/build-config-x86_64.txt .
          shasum -a 256 \
            ffmpeg-8.1.2.tar.xz \
            build-config-arm64.txt \
            build-config-x86_64.txt \
            > ffmpeg-8.1.2-assets.sha256
          gh release upload "$RELEASE_TAG" \
            Fruit-Truck-macOS-universal.dmg.sha256 \
            ffmpeg-8.1.2.tar.xz \
            build-config-arm64.txt \
            build-config-x86_64.txt \
            ffmpeg-8.1.2-assets.sha256 \
            THIRD_PARTY_NOTICES.md \
            --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
