name: Supply-chain audit

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/desktop/package-lock.json"
      - "apps/desktop/package.json"
      - "apps/desktop/src-tauri/Cargo.lock"
      - "apps/desktop/src-tauri/Cargo.toml"
      - "apps/desktop/src-tauri/osv-scanner.toml"
      - "apps/desktop/scripts/check-dependency-licenses.mjs"
      - "apps/desktop/scripts/generate-sbom.mjs"
      - "apps/desktop/scripts/run-supply-chain-checks.sh"
      - ".github/workflows/supply-chain.yml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/package-lock.json"
      - "apps/desktop/package.json"
      - "apps/desktop/src-tauri/Cargo.lock"
      - "apps/desktop/src-tauri/Cargo.toml"
      - "apps/desktop/src-tauri/osv-scanner.toml"
      - "apps/desktop/scripts/check-dependency-licenses.mjs"
      - "apps/desktop/scripts/generate-sbom.mjs"
      - "apps/desktop/scripts/run-supply-chain-checks.sh"
      - ".github/workflows/supply-chain.yml"

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.96.0

      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --locked --version 0.19.9

      - name: Install JavaScript dependencies without lifecycle scripts
        working-directory: apps/desktop
        run: npm ci --ignore-scripts

      - name: Audit dependencies, enforce licenses, and generate SBOM
        run: bash apps/desktop/scripts/run-supply-chain-checks.sh "$RUNNER_TEMP/fruit-truck-supply-chain"

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fruit-truck-sbom-${{ github.sha }}
          path: ${{ runner.temp }}/fruit-truck-supply-chain/fruit-truck.cdx.json
          if-no-files-found: error
          retention-days: 14

  osv-full:
    name: OSV full vulnerability scan
    if: github.event_name != 'pull_request'
    # Google-maintained reusable workflow, pinned to the signed v2.5.1 commit.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@880d9b542cc66d36d91d51b3fbcc038f5f28cfc5
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      scan-args: |-
        --include-git-root
        -r
        ./

  osv-pr:
    name: OSV pull-request vulnerability scan
    if: github.event_name == 'pull_request'
    # The PR workflow compares the merge commit with its base and reports newly introduced findings.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@880d9b542cc66d36d91d51b3fbcc038f5f28cfc5
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      scan-args: |-
        --include-git-root
        -r
        ./
