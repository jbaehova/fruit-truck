name: OpenRouter contract drift

on:
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:
    inputs:
      live:
        description: Run the authenticated OpenRouter catalog and endpoint check
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: openrouter-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    name: Validate anonymized contract fixtures
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install JavaScript dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Validate runtime-normalized OpenRouter fixtures
        run: npm run check:openrouter-contracts

  live:
    name: Validate live OpenRouter schema
    if: ${{ github.event_name == 'schedule' || inputs.live == true }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install JavaScript dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify the live-check credential is configured
        run: test -n "$OPENROUTER_API_KEY"

      - name: Validate live catalog and endpoint schema
        run: npm run check:openrouter-contracts -- --live
