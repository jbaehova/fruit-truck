name: Check desktop app

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: desktop-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            agent-kit/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        run: npm ci

      - name: Install Chromium and FFmpeg
        run: |
          npx playwright install chromium
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg

      - name: Run TypeScript, lint, and unit checks
        run: |
          npm run check
          npm run test:unit
          npm run build

      - name: Run headless full-window E2E
        run: npm run test:e2e

      - name: Build and verify Agent Kit
        working-directory: agent-kit
        run: |
          npm ci
          npm run build
          npm run check

  native-build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            agent-kit/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop and Agent Kit dependencies
        working-directory: .
        run: |
          npm ci --prefix apps/desktop
          npm ci --prefix agent-kit

      - name: Run Rust tests
        run: |
          bash scripts/prepare-core-sidecar.sh
          bash scripts/prepare-agent-runtime.sh
          cargo test --manifest-path src-tauri/Cargo.toml --workspace
          cargo test --manifest-path src-tauri/Cargo.toml -p fruit-truck-core --release \
            tests::one_hundred_session_command_p95_stays_below_twenty_milliseconds -- --ignored --exact
          cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Build native desktop test bundle
        run: npm run build:e2e:desktop
