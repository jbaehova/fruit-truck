name: Check desktop app

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: desktop-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run TypeScript, lint, and unit checks
        run: |
          npm run check
          npm run test:unit
          npm run build

      - name: Run headless full-window E2E
        run: npm run test:e2e

  native-build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        run: npm ci

      - name: Run Rust tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build native desktop test bundle
        run: npx tauri build --debug --bundles app --config src-tauri/tauri.e2e.conf.json
