name: OpenRouter paid provider smoke

on:
  workflow_dispatch:
    inputs:
      acknowledgement:
        description: Type RUN_PAID_OPENROUTER_SMOKE to authorize the configured paid cases
        required: true
        type: string
      budget_usd:
        description: Maximum authorized total spend in USD (hard limit $5)
        required: true
        default: "1.00"
        type: string

permissions:
  contents: read

concurrency:
  group: openrouter-paid-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: ${{ inputs.acknowledgement == 'RUN_PAID_OPENROUTER_SMOKE' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: openrouter-paid-smoke
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_PAID_SMOKE_CASES: ${{ secrets.OPENROUTER_PAID_SMOKE_CASES }}
      OPENROUTER_PAID_SMOKE_ACK: ${{ inputs.acknowledgement }}
      OPENROUTER_PAID_SMOKE_BUDGET_USD: ${{ inputs.budget_usd }}
      OPENROUTER_PAID_SMOKE_OUTPUT_DIR: /tmp/fruit-truck-paid-smoke-${{ github.run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install JavaScript dependencies without lifecycle scripts
        working-directory: apps/desktop
        run: npm ci --ignore-scripts

      - name: Verify paid-smoke secrets
        run: |
          test -n "$OPENROUTER_API_KEY"
          test -n "$OPENROUTER_PAID_SMOKE_CASES"

      - name: Run explicitly authorized paid provider matrix
        working-directory: apps/desktop
        run: node scripts/run-openrouter-paid-smoke.mjs

      - name: Upload bounded paid-result evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openrouter-paid-smoke-${{ github.run_id }}
          path: /tmp/fruit-truck-paid-smoke-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
